/* MY HAPPY PLACE PHASE 1 DESIGN TOKENS — no existing storage or AAC layout changes */

body button{min-height:56px;border-radius:16px;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}body button:active{transform:scale(.965);filter:brightness(.97)}button:focus,button:focus-visible{outline:3px solid var(--mhp-accent);outline-offset:2px}
.wrap{max-width:1120px;padding:20px 22px}.panel{background:var(--mhp-paper);box-shadow:var(--mhp-shadow);border:1px solid var(--mhp-border);border-radius:var(--mhp-radius)}
h2,h3{letter-spacing:-.5px}h2{font-size:32px}h3{font-size:23px}p{line-height:1.48}.muted{color:var(--mhp-secondary);font-size:16px}.hero{display:none}
.mhp-hero{position:relative;display:flex;align-items:center;justify-content:space-between;background:var(--mhp-sky);border:2px solid #C7E3F3;border-radius:27px;min-height:230px;overflow:hidden;margin:5px 0 26px;padding:35px 37px;box-shadow:var(--mhp-shadow)}

/* Phase 4: calm storybook learning system */

:root{--mhp-focus:#285fba;--mhp-soft-border:#d6dfe9}

.sticker-choice.chosen{border-color:#384F93;box-shadow:0 0 0 4px #c9d3f2}
.sticker-choice.eraser{font-weight:800;color:#7a4c3c;background:#fde6dc}
.mhp-overlay{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:rgba(40,48,78,.45);overflow:hidden}
.mhp-overlay.celebrate{background:rgba(255,249,238,.55)}
.celebrate-card{background:#fff;border:3px solid #FFE6A3;border-radius:28px;padding:18px 28px 22px;text-align:center;box-shadow:0 18px 40px rgba(47,57,93,.25);animation:mhpPop .35s ease-out;max-width:90vw}
.celebrate-card p{font-size:26px;font-weight:800;margin:6px 0 0;color:#303B5C}
.celebrate-pip{width:130px;margin:0 auto}.celebrate-pip svg{width:100%;height:auto}
@keyframes mhpPop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.confetti{position:absolute;top:-20px;border-radius:3px;animation:mhpFall 1.9s ease-in forwards}
@keyframes mhpFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(540deg)}}
.sheet-card{background:#fff;border-radius:26px;padding:18px;max-width:min(94vw,680px);max-height:92vh;overflow:auto;text-align:center}
.sheet-card img{max-width:100%;max-height:55vh;border-radius:16px;border:3px solid #eee;-webkit-touch-callout:default}
.mhp-overlay.viewer{background:rgba(25,30,50,.92)}.mhp-overlay.viewer img{max-width:100%;max-height:74vh;border-radius:14px;background:#fff}.mhp-overlay.viewer p{color:#fff;font-size:18px}
textarea{font:inherit;font-size:15px;border:2px solid #d6dfe9;border-radius:12px;padding:8px}
details summary{cursor:pointer;min-height:44px;padding:10px 0;font-weight:700;color:#384F93}
body.mhp-user-reduced .confetti{display:none}
@media(prefers-reduced-motion:reduce){.confetti{display:none}}
/* iOS 12 Safari ignores flexbox gap */
.no-flexgap .toolbar>*,.no-flexgap .tabRow>*,.no-flexgap .context-panel>*,.no-flexgap .quick-row>*,.no-flexgap .mhp-shortcuts-actions>*,.no-flexgap .nav>*,.no-flexgap .learning-path>*,.no-flexgap .sticker-shelf>*,.no-flexgap .lab-heading>*,.no-flexgap .storybook-frame>*,.no-flexgap header>*{margin:4px}

:root{--ink:#4A3762;--ink-soft:#6E5F86;--sky:#BFE9FF;--cream:#FFF7E8;--pink:#FF6FA5;--pink-d:#D9487F;--sun:#FFC93C;--sun-d:#E0A51C;--sky-b:#4FB3F0;--sky-d:#2E8CCB;--mint:#2EC4B6;--mint-d:#16998D;--lilac:#9B6CF6;--lilac-d:#7449D6;--orange:#FF9F43;--orange-d:#DB7A1E;--leaf:#6CC56C;--card-edge:#E9DDF3;
--font-display:'Arial Rounded MT Bold','MHP Display',ui-rounded,'Avenir Next',sans-serif;--font-body:'MHP Body',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
html,body{background:#FFF7E8;color:var(--ink);font-family:var(--font-body)}
body{background:linear-gradient(180deg,#BFE9FF 0,#E6F7FF 240px,#FFF7E8 620px) no-repeat,#FFF7E8;min-height:100vh}
h1,h2,h3,.section-name,.activity-name,.mhp-place-title,.lab-heading h2{font-family:var(--font-display);font-weight:700;letter-spacing:0;color:var(--ink)}
header{background:rgba(255,255,255,.92)!important;border-bottom:0!important;box-shadow:0 4px 0 #E9DDF3,0 8px 20px rgba(74,55,98,.08)!important;border-radius:0 0 26px 26px}
header h1{font-size:22px!important;color:var(--ink)!important}
.version{background:#FFE7F1!important;color:var(--pink-d)!important;font-family:var(--font-display)}
.brandmark{background:#FFE7F1!important;border-radius:18px!important}
/* chunky candy buttons (the AAC board keeps its own styling) */
button:not(.aacbtn){font-family:var(--font-display);font-weight:700;border:0!important;border-radius:20px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--card-edge),0 9px 18px rgba(74,55,98,.10);transition:transform .08s ease,box-shadow .08s ease}
button:not(.aacbtn):active{transform:translateY(4px)!important;box-shadow:0 1px 0 var(--card-edge),0 3px 8px rgba(74,55,98,.10)}
button.primary,button.next-step{background:var(--pink)!important;color:#fff!important;box-shadow:0 5px 0 var(--pink-d),0 9px 18px rgba(217,72,127,.25)!important}
button.warn{background:#FFE1D6!important;color:#9A3B1E!important;box-shadow:0 5px 0 #F3B9A4!important}
.quiet-btn{background:#fff!important;font-size:16px!important}
.nav .mhp-topnav{background:transparent!important;box-shadow:none!important;color:var(--ink)!important}
.nav .mhp-topnav:active{background:#FFE7F1!important}
.mhp-topnav .mhp-icon{color:var(--pink-d)}
select,input[type=text],input[type=number],input[type=password],textarea{border:3px solid #E9DDF3!important;border-radius:16px!important;font-family:var(--font-body);color:var(--ink)}
.panel,section.panel{border:0!important;border-radius:28px!important;box-shadow:0 6px 0 var(--card-edge),0 14px 28px rgba(74,55,98,.08)!important}
.muted{color:var(--ink-soft)}
#status{background:var(--ink)!important;font-family:var(--font-display);top:92px;bottom:auto!important;transform:translate(-50%,-20px)}#status.show{transform:translate(-50%,0)}
/* ---------- Home village ---------- */
.home-greet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 10px}
.home-greet h2{font-size:30px;margin:0}
.home-greet .greet-bubble{background:#fff;border-radius:22px;padding:10px 18px;font-family:var(--font-display);font-size:18px;box-shadow:0 4px 0 var(--card-edge)}
.village-wrap{border-radius:32px;overflow:hidden;background:#86D3FF;box-shadow:0 8px 0 #CDE9F8,0 18px 34px rgba(74,55,98,.16);border:5px solid #fff}
.village{display:block;width:100%;height:auto}
.village .sign-text{font-family:var(--font-display);font-weight:700}
.village .place{cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.village .place .lift{transition:transform .12s ease}
.village .place.pressed .lift,.village .place:focus .lift{transform:translateY(5px)}
.village .place:focus .sign-text{text-decoration:underline}
@keyframes mhpDrift{0%{transform:translateX(0)}50%{transform:translateX(40px)}100%{transform:translateX(0)}}
@keyframes mhpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes mhpSwing{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes mhpTwinkle{0%,100%{opacity:1}50%{opacity:.45}}
.village .drift{animation:mhpDrift 26s ease-in-out infinite}.village .drift.slow{animation-duration:38s}
.village .bob{animation:mhpBob 3.2s ease-in-out infinite}.village .pip-hero{animation:mhpBob 2.6s ease-in-out infinite}
.village .swing{animation:mhpSwing 2.8s ease-in-out infinite}.village .twinkle{animation:mhpTwinkle 2s ease-in-out infinite}
body.mhp-classic .village *,body.mhp-user-reduced .village *{animation:none!important}
.help-row{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 8px}
.help-row button{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;font-size:18px;min-height:64px}
.help-row svg{width:46px;height:46px}
/* ---------- Section pages ---------- */
.sec-hero{position:relative;display:flex;align-items:center;gap:16px;border-radius:30px;padding:18px 22px;margin:4px 0 18px;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.12);overflow:hidden;min-height:150px}
.sec-hero h2{color:#fff!important;font-size:38px;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.sec-hero p{margin:4px 0 0;font-size:19px;color:#fff;opacity:.95}
.sec-hero .sec-art{flex:0 0 auto;width:150px;height:150px;margin:-10px 0 -30px}
.sec-hero .sec-copy{flex:1}
.sec-hero .quiet-btn{position:absolute;top:12px;right:14px}
.sec-hero:after{content:'';position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.activity-grid{gap:16px!important}
.activity-card{position:relative;border:0!important;border-radius:28px!important;background:#fff;min-height:190px!important;padding:16px 16px 18px!important;box-shadow:0 7px 0 var(--card-edge),0 14px 26px rgba(74,55,98,.10)!important;align-items:flex-start;text-align:left}
.activity-card .act-art{display:flex;align-items:center;justify-content:center;width:86px;height:86px;border-radius:26px;margin-bottom:10px}
.activity-card .act-art svg{width:74px;height:74px}
.activity-name{font-size:21px!important}
.activity-desc{font-size:15px!important;color:var(--ink-soft)!important}
.activity-open{display:none}
.group-title{font-family:var(--font-display);font-size:22px;color:var(--ink)}
.context-panel{background:#fff!important;border-radius:24px;box-shadow:0 5px 0 var(--card-edge)}
.lab-heading h2{font-size:30px}
.lab-shell{background:#fff!important;border:0!important;border-radius:30px!important;box-shadow:0 7px 0 var(--card-edge),0 16px 30px rgba(74,55,98,.10);padding:6px!important}
@media(max-width:800px){.sec-hero .sec-art{width:110px;height:110px}.sec-hero h2{font-size:30px}.home-greet h2{font-size:24px}}
@media(max-width:560px){.home-greet .greet-bubble{display:none}.sec-hero{padding:14px}.sec-hero .sec-art{width:84px;height:84px;margin:0}}
.activity-desc,.sec-hero p,.help-row span{font-family:var(--font-body)!important;font-weight:500!important}

.sec-hero:after{pointer-events:none;z-index:0}.sec-hero .quiet-btn{z-index:2}.sec-hero .sec-copy,.sec-hero>div{position:relative;z-index:1}
/* 4.5 learning games (shell) */
.learn-panel{padding:18px!important}
.learn-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.learn-pic{flex:0 0 340px;max-width:100%}
.learn-art{display:block;width:100%;height:auto;border-radius:22px;border:5px solid #fff;box-shadow:0 5px 0 var(--card-edge)}
.learn-copy{flex:1;min-width:220px}
.learn-q{font-size:26px;line-height:1.25;margin:6px 0 10px}
.learn-answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0}
.learn-answers button{min-height:80px!important;font-size:21px!important;border-radius:22px!important}
.learn-end{width:150px;margin:0 auto}
.learning-path .path-stone.here{background:#FFE7F1;border-color:#FF8FB8}
.logic-bridge{margin:0 0 12px}.logic-pip{transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.logic-seq{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#F6F0FB;border-radius:24px;padding:14px;margin:6px 0 12px}

function match() {
  heading('Zoo Animal Matching');
  var category = 'All animals', choiceCount = 3, showNames = true, lastAnswer = '', streak = 0;

  mhpChips(opts, [['All animals', 'All']].concat(Object.keys(MHP_HAB).map(function (k) { return [k, k]; })), category, function (v) { category = v; round(); });
  mhpChips(opts, [[2, '2 pictures'], [3, '3 pictures'], [4, '4 pictures'], [6, '6 pictures']], choiceCount, function (v) { choiceCount = v; round(); });
  mhpChips(opts, [[true, 'Show names'], [false, 'Pictures only']], showNames, function (v) { showNames = v; round(); });
  var p = panel(); p.className = 'panel learn-panel';
  function round() {
    p.replaceChildren();
    var pool = ZOO_ANIMALS.filter(function (a) { return category === 'All animals' || a[2] === category; });
    var choices = shuffleCopy(pool).slice(0, Math.min(choiceCount, pool.length)); if (!choices.length) return;

    node('h2', 'Can you find the ' + answer[1] + '?', top);

    var g = node('div', null, p, 'match-grid');

        else { tone(200); b.className = 'match-card gentle-retry'; b.disabled = true; status('That is the ' + item[1] + '. Try another!'); }

  function tick(t) {

    var ph = ((t - t0) / 1000) % 8, k = ph < 4 ? ph / 4 : 1 - (ph - 4) / 4, sc = 1 + .55 * (0.5 - 0.5 * Math.cos(k * Math.PI));
    orb.setAttribute('transform', 'translate(450 230) scale(' + sc.toFixed(3) + ') translate(-450 -230)');
    word.textContent = ph < 4 ? 'Breathe in…' : 'Breathe out…';
    animFrame = requestAnimationFrame(tick);

  var bar = toolbar(app);
  button('▶ Start breathing', function () { if (!running) { running = true; t0 = 0; animFrame = requestAnimationFrame(tick); } }, bar, 'primary');
  button('⏸ Rest', function () { running = false; cancelAnimationFrame(animFrame); orb.removeAttribute('transform'); word.textContent = 'Resting'; }, bar);

/* 5.0: friendlier "Pip" character voice for games, stories and celebrations (shell side).
   Uses voices already installed on the device (offline). The Talk/AAC board keeps its usual voice unless a grown-up opts in. */
var MHP_VOICE_KEY = 'mhp_voice_v50';
var MHP_VOICE_STYLES = { pip: { name: 'Pip (cheerful)', pitch: 1.45, rate: .92 }, gentle: { name: 'Gentle storyteller', pitch: 1.15, rate: .82 }, silly: { name: 'Silly squeaky', pitch: 1.9, rate: 1.02 }, plain: { name: 'Plain', pitch: 1, rate: .9 } };
var mhpVoice = (function () { try { var v = JSON.parse(localStorage.getItem(MHP_VOICE_KEY)); if (v && v.style) return v; } catch (e) { } return { style: 'pip', uri: '', aac: false, cheer: true }; })();
function mhpSaveVoice() { try { localStorage.setItem(MHP_VOICE_KEY, JSON.stringify(mhpVoice)); } catch (e) { } }
var MHP_NICE_VOICES = ['Samantha', 'Karen', 'Moira', 'Tessa', 'Fiona', 'Victoria', 'Allison', 'Ava', 'Susan', 'Serena', 'Google US English', 'Microsoft Jenny', 'Microsoft Aria', 'Microsoft Zira'];
function mhpVoices() { try { return (speechSynthesis.getVoices() || []).filter(function (v) { return /^en/i.test(v.lang); }); } catch (e) { return []; } }
function mhpPickVoice() {
  var list = mhpVoices(); if (!list.length) return null;
  if (mhpVoice.uri) for (var i = 0; i < list.length; i++) if (list[i].voiceURI === mhpVoice.uri) return list[i];
  for (var n = 0; n < MHP_NICE_VOICES.length; n++) for (var j = 0; j < list.length; j++) if (list[j].name.indexOf(MHP_NICE_VOICES[n]) === 0) return list[j];
  for (var k = 0; k < list.length; k++) if (/en[-_]US/i.test(list[k].lang)) return list[k];
  return list[0];
}
try { if (window.speechSynthesis && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', function () { }); } catch (e) { }
function mhpVoiceSettings() { var st = MHP_VOICE_STYLES[mhpVoice.style] || MHP_VOICE_STYLES.pip, v = mhpPickVoice(); return { uri: v ? v.voiceURI : '', pitch: st.pitch, rate: st.rate * ((Number(data.voiceRate) || .88) / .88) }; }
/* speak(): Talk board keeps the plain voice (motor-planning and listening consistency) unless the grown-up opts in */
function speak(t) {
  if (!t || data.quiet) return;
  if (!('speechSynthesis' in window)) { status('Speech synthesis unavailable on this device.'); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    if (state.view === 'talk' && !mhpVoice.aac) { u.rate = Number(data.voiceRate) || .88; }
    else { var s = mhpVoiceSettings(), v = mhpPickVoice(); if (v) u.voice = v; u.pitch = s.pitch; u.rate = s.rate; }
    speechSynthesis.speak(u);
  } catch (e) { status('Speech could not start on this device.'); }
}
/* Pip cheers out loud at celebrations */

mhpCelebrate = function (text) { mhpCelebrateBase(text); if (mhpVoice.cheer && !data.quiet) { var cheer = ['Hooray! ', 'Yay! ', 'Woo-hoo! ', 'Amazing! ', 'You did it! ']; speak(cheer[Math.floor(Math.random() * cheer.length)] + (text || '')); } };
/* send the voice to the games too */

gameSettingsFrame = function (frame, mode, sub) {
  var keep = mhpExtra, vs = mhpVoiceSettings(), copy = {}, k; for (k in mhpExtra) copy[k] = mhpExtra[k];
  copy.voiceURI = vs.uri; copy.voicePitch = vs.pitch; copy.voiceRateCartoon = vs.rate; mhpExtra = copy;

  var c2 = node('label', null, p), cb2 = node('input', null, c2); cb2.type = 'checkbox'; cb2.checked = !!mhpVoice.aac; node('span', ' Also use this voice on the Talk board (off keeps her communication voice steady)', c2); cb2.onchange = function () { mhpVoice.aac = cb2.checked; mhpSaveVoice(); };
